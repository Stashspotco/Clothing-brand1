<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Stash Spot Co.</title>
  <meta name="description" content="Shop hoodies, tees, outerwear, pants and accessories. Monochrome streetwear, built to last.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body data-page="shop">
  <header id="site-header"></header>

  <main>
    <section class="page-head wrap">
      <nav class="breadcrumbs"><a href="index.html">Home</a> / Shop</nav>
      <h1 id="shop-title">Shop all</h1>
      <p class="lede">Every piece, one place. Filter by category or sort to find your fit.</p>
    </section>

    <div class="wrap">
      <div class="toolbar">
        <div class="filters" id="shop-filters"></div>
        <div style="display:flex;align-items:center;gap:14px">
          <span class="shop-count" id="shop-count"></span>
          <select class="select" id="shop-sort" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="new">Newest</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="name">Alphabetical</option>
          </select>
        </div>
      </div>
      <div class="grid shop-grid" id="shop-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/app.js" defer></script>
</body>
</html>
